<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFC 勝率3Dマップ</title>
<meta name="description" content="UFCランカー176人を有効打/分（実測）・TD成功率 (%)・TD防御 (%)の3軸でプロット。色は勝率 (%)。階級で絞り込み、回転・ズームできます。">
<!-- X / SNS に貼ったときのカード表示用 -->
<meta property="og:type" content="website">
<meta property="og:title" content="UFC 勝率3Dマップ">
<meta property="og:description" content="UFCランカー176人を有効打/分（実測）・TD成功率 (%)・TD防御 (%)の3軸でプロット。色は勝率 (%)。階級で絞り込み、回転・ズームできます。">
<meta property="og:url" content="https://TH-appsdev.github.io/ufc-3d-map/">
<meta property="og:image" content="https://TH-appsdev.github.io/ufc-3d-map/thumb.png">
<meta name="twitter:image" content="https://TH-appsdev.github.io/ufc-3d-map/thumb.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UFC 勝率3Dマップ">
<meta name="twitter:description" content="UFCランカー176人を有効打/分（実測）・TD成功率 (%)・TD防御 (%)の3軸でプロット。色は勝率 (%)。階級で絞り込み、回転・ズームできます。">
<style>
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#0b1422;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
  .wrap{background:#0f1a2b;padding:14px;border-radius:12px;color:#e8eef7;margin:12px}
  .bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:14px}
  label{display:inline-flex;align-items:center;gap:5px}
  #axrow{display:inline-flex;gap:14px;align-items:center}
  select,input{padding:5px 8px;background:#1b2942;color:#e8eef7;border:1px solid #2f4162;border-radius:6px;
               font-family:inherit;max-width:100%}
  button{padding:6px 12px;cursor:pointer;background:#1b2942;color:#e8eef7;border:1px solid #2f4162;border-radius:6px;
         font-family:inherit}
  button:hover{background:#26375a}
  .reset{background:#2b4a7a;border-color:#4e7ab8;font-weight:600;padding:6px 14px}
  .reset:hover{background:#3a5f99}
  .reset:active{transform:translateY(1px)}
  h1{font-size:17px;margin:0 0 10px;font-weight:600}
  /* 枠の内側＝ドラッグで回転・スクロールでズーム（勝率バーまで含む）。
     外側＝ページのスクロール。 */
  #plotwrap{position:relative;border:1px solid #4f74ab;border-radius:10px;
            background:rgba(79,116,171,.10);overflow:hidden}
  #plot{height:clamp(360px, 70vh, 760px)}
  #btns{position:absolute;top:10px;right:12px;z-index:5;
        display:flex;gap:6px;align-items:center}
  #qwrap{display:inline-flex;align-items:center;gap:4px;
         background:rgba(11,20,34,.75);padding:3px 8px;border-radius:7px}
  #q{min-width:150px}
  #plotbox{position:relative}
  #zcap{display:none}
  .zbtn{display:none}
  #info{display:none}

  /* --- スマートフォン --- */
  @media (max-width: 640px){
    .wrap{margin:6px;padding:10px;border-radius:10px}
    h1{font-size:15px;margin-bottom:8px}
    .bar{gap:8px 10px;font-size:13px;margin-bottom:4px}
    /* iOS で入力時に勝手に拡大されないよう 16px 以上にする */
    select,input,button{font-size:16px;padding:7px 9px}
    /* X/Y/Z は3行ではなく1行に収める */
    #axrow{display:flex;width:100%;gap:5px}
    #axrow label{flex:1;min-width:0;gap:2px}
    #axrow select{width:100%;min-width:0;padding:7px 2px 7px 5px;font-size:13px}
    #axrow b{font-size:12px;white-space:nowrap}
    .jiku{display:none}
    select{max-width:42vw}
    #q{max-width:48vw}
    /* 上部は横向きのカラーバーが占めるので、操作ボタンは下に逃がす */
    /* 操作行はグラフの上。絶対配置をやめて通常のフローに戻す */
    #btns{position:static;top:auto;right:auto;padding:9px 9px 7px;gap:5px}
    #qwrap{flex:1;min-width:0;padding:2px 6px}
    .qtxt{display:none}
    #q{min-width:0;width:100%}
    .reset{padding:6px 10px;font-size:13px;font-weight:600}
    .zbtn{display:block;width:38px;padding:6px 0;font-size:17px;line-height:1;
          font-weight:700;background:#2b4a7a;border-color:#4e7ab8}
    .zbtn:active{background:#3a5f99}
    #plot{height:min(52vh, 380px);min-height:290px}
    /* 詳細はグラフの外（枠の下部）に出すので、点に被らない */
    #zcap{display:block;position:absolute;left:2px;top:42%;z-index:4;
          writing-mode:vertical-rl;transform:rotate(180deg);
          font-size:10px;pointer-events:none;white-space:nowrap}
    .iname{font-size:13px;margin-bottom:3px}
    .ic{display:inline-block;margin:0 10px 2px 0;white-space:nowrap}
    #info{display:block;min-height:54px;padding:0 10px 9px;
          border-bottom:1px solid #35507d;background:rgba(11,20,34,.55);
          font-size:11.5px;line-height:1.5}
  }
</style></head><body>
<div class="wrap">
  <h1>UFC 勝率3Dマップ</h1>
  <div class="bar">
    <span id="axrow">
      <label><b style="color:#ff6a00">X<span class="jiku">軸</span></b> <select id="sx"></select></label>
      <label><b style="color:#e03cff">Y<span class="jiku">軸</span></b> <select id="sy"></select></label>
      <label><b style="color:#00f0a0">Z<span class="jiku">軸</span></b> <select id="sz"></select></label>
    </span>
  </div>
  <div class="bar">
    <label>階級 <select id="sf"></select></label>
    <label>性別 <select id="sg"></select></label>
    <span id="count" style="opacity:.65;font-size:12px"></span>
  </div>
  <div id="plotwrap">
    <div id="btns">
      <label id="qwrap">🔍<span class="qtxt"> 名前検索</span>
        <input id="q" placeholder="例: Pantoja"></label>
      <button id="zout" class="zbtn" title="縮小">−</button>
      <button id="zin"  class="zbtn" title="拡大">＋</button>
      <button id="reset" class="reset" title="回転・ズームを初期状態に戻します">
        ⟲ 視点をリセット
      </button>
    </div>
    <div id="info"></div><!-- スマホ用: 選手の詳細 -->
    <div id="plotbox">
      <div id="plot"></div>
      <div id="zcap"></div><!-- スマホ用: Z軸のキャプション -->
    </div>
  </div>
</div>

  return {title:{text: (MOBILE && isZ) ? "" : title,
                 font:{color:color, size: MOBILE ? 10 : 14}},
          tickfont:{color:"#d4e0f0", size: MOBILE ? 9 : 11},
          showbackground:true, backgroundcolor:"#16263f",   // 立方体の面を少し明るく
          gridcolor:"#5a749c", gridwidth:2,                 // 格子線をはっきり
          showline:true, linecolor:color, linewidth:4,      // 各軸の縁を軸色で描く
          zeroline:false,
          showspikes:true, spikecolor:SPIKE, spikethickness:2, spikesides:true};
}

// ホバー1行分：軸の色付きバッジ＋ラベル＋値
function row(ax, field, val){
  return "<span style='color:" + AXC[ax] + "'>■ " + ax.toUpperCase() + "</span> "
       + (LAB[field]||field) + ": <b>" + val + "</b><br>";
}

let curF = {x:"", y:"", z:""};   // いま各軸に割り当てている指標

// スマホ用：タップした選手の詳細。グラフの外に出すので点が隠れない。
const INFO_HINT = "<span style='opacity:.55'>点をタップすると選手の詳細が出ます</span>";
function showInfo(p){
  if (!MOBILE) return;
  if (!p){ g("info").innerHTML = INFO_HINT; return; }
  const cd = p.customdata || [];
  const num = v => v == null ? "-"
      : (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
  // 軸が何を示しているか（指標名）と数値、最後に勝率
  const cell = (mark, col, name, v) =>
      "<span class='ic'><span style='color:" + col + "'>" + mark + "</span> "
    + name + " <b>" + num(v) + "</b></span>";
  g("info").innerHTML =
      "<div class='iname'><b>" + (p.text || "") + "</b>"
    + "<span style='opacity:.6'>　" + (cd[1] || "") + "</span>"
    + (p.more ? "<span style='opacity:.6'>　ほか " + p.more + " 人</span>" : "")
    + "</div>"
    + cell("■ X", AXC.x, LAB[curF.x] || curF.x, p.x)
    + cell("■ Y", AXC.y, LAB[curF.y] || curF.y, p.y)
    + cell("■ Z", AXC.z, LAB[curF.z] || curF.z, p.z)
    + cell("●",  "#8aa0c0", LAB[FC] || FC, cd[0]);
}

// ズーム（スマホはピンチが効かないことがあるのでボタンで操作する）
function zoom(factor){
  const c = curCam.center || {x:0, y:0, z:0}, e = curCam.eye;
  let dx = e.x-c.x, dy = e.y-c.y, dz = e.z-c.z;
  const r = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (!(r > 0)) return;
  const nr = Math.max(0.9, Math.min(6.0, r * factor));   // 寄りすぎ・引きすぎを防ぐ
  const k = nr / r;
  curCam = Object.assign({}, curCam,
    {eye:{x:c.x+dx*k, y:c.y+dy*k, z:c.z+dz*k}});
  Plotly.relayout("plot", {"scene.camera": curCam});
}

function render(){
  const fx=sx.value, fy=sy.value, fz=sz.value, fc=FC;
  curF = {x:fx, y:fy, z:fz};
  if (MOBILE) g("zcap").innerHTML =
    "<span style='color:" + AXC.z + "'>" + (LAB[fz]||fz) + "</span>";
  const flt=sf.value, gen=sg.value, query=norm(q.value.trim());
  const X=D.stats[fx], Y=D.stats[fy], Z=D.stats[fz], C=D.stats[fc];

  const bx=[],by=[],bz=[],bc=[],bt=[],bd=[];
  D.names.forEach((nm,i) => {
    if (flt !== "すべての階級" && D.divisions[i] !== flt) return;
    if (gen !== "男女とも" && D.genders[i] !== gen) return;
    if (X[i]==null || Y[i]==null || Z[i]==null) return;
    bx.push(X[i]); by.push(Y[i]); bz.push(Z[i]); bc.push(C[i]);
    bt.push(nm); bd.push([C[i], D.divisions[i]]);
  });
  // 色の範囲は表示中のデータに合わせてコントラストを出す
  const cv = bc.filter(v => v != null);
  const cmin = cv.length ? Math.min(...cv) : 0, cmax = cv.length ? Math.max(...cv) : 1;

  // ツールチップの中身。通常の点でも検索でヒットした点でも同じものを使う。
  const NAME_ONLY = "<b>%{text}</b><extra></extra>";
  const HOVER =
      "<b style='font-size:14px'>%{text}</b>"
    + "<span style='color:#8aa0c0'>　%{customdata[1]}</span><br>"
    + row("x", fx, "%{x}") + row("y", fy, "%{y}") + row("z", fz, "%{z}")
    + "<span style='color:#8aa0c0'>●</span> " + (LAB[fc]||fc)
    + ": <b>%{customdata[0]}</b><extra></extra>";

  const traces = [{
    type:"scatter3d", mode:"markers", name:"選手", showlegend:false,
    x:bx, y:by, z:bz, text:bt, customdata:bd,
    marker:{size: MOBILE ? 8 : 6, color:bc, colorscale:SCALE, cmin:cmin, cmax:cmax,
            opacity: query ? 0.22 : 0.92, line:{width:0.4, color:"#0f1a2b"},
            // 狭い画面では縦のカラーバーが Z 軸を圧迫するので、上部に横向きで置く
            colorbar: MOBILE
              ? {orientation:"h", x:0.42, xanchor:"center", y:1.0, yanchor:"top",
                 len:0.72, thickness:8, outlinewidth:0,
                 title:{text:LAB[fc]||fc, side:"right", font:{size:10}},
                 tickfont:{color:"#d4e0f0", size:9}}
              : {title:{text:LAB[fc]||fc, side:"right", font:{size:13}},
                 len:0.6, thickness:14, outlinewidth:0,
                 tickfont:{color:"#d4e0f0", size:11}}},
    hovertemplate: MOBILE ? NAME_ONLY : HOVER,
    hoverlabel:{bgcolor:"rgba(12,21,36,0.94)", bordercolor:"#55688a",
                font:{color:"#e8eef7", size:13}}
  }];

  let hits = 0;
  if (query){   // 検索は絞り込みを無視して全体から探す
    const hx=[],hy=[],hz=[],ht=[],hd=[],hc=[];
    D.names.forEach((nm,i) => {
      if (!SEARCH_KEY[i].includes(query)) return;
      if (X[i]==null || Y[i]==null || Z[i]==null) return;
      hx.push(X[i]); hy.push(Y[i]); hz.push(Z[i]); hc.push(C[i]);
      ht.push(nm); hd.push([C[i], D.divisions[i]]);
    });
    traces.push({
      type:"scatter3d", mode:"markers+text", name:"一致 "+ht.length+"件",
      x:hx, y:hy, z:hz, text:ht, customdata:hd,
      textposition:"top center",
      textfont:{color:"#fff", size: MOBILE ? 12 : 12},
      // 色は塗り替えず勝率のまま。大きさと白い縁取りで目立たせる
      // （黄色で塗ると勝率が読めなくなり、カラースケール中間の色とも紛れるため）
      marker:{size: MOBILE ? 12 : 10,
              color:hc, colorscale:SCALE, cmin:cmin, cmax:cmax, showscale:false,
              line:{color:"#ffffff", width:2}},
      // 通常の点と同じ内容（X/Y/Z の値と勝率）を出す
      hovertemplate: MOBILE ? NAME_ONLY : HOVER,
      hoverlabel:{bgcolor:"rgba(12,21,36,0.94)", bordercolor:"#ffffff",
                  font:{color:"#e8eef7", size:13}}
    });
    hits = hx.length;
    // 検索でヒットしたら、タップしなくても詳細欄に出す
    if (hits > 0){
      showInfo({text:ht[0], x:hx[0], y:hy[0], z:hz[0], customdata:hd[0],
                more: hits > 1 ? hits - 1 : 0});
    } else {
      g("info").innerHTML = "<span style='opacity:.55'>該当する選手がいません</span>";
    }
  }

  g("count").textContent = "表示 " + bx.length + " 人 / 全 " + D.names.length + " 人"
    + (query ? "　🔍 一致 " + hits + " 人" : "");

  Plotly.react("plot", traces, {
    paper_bgcolor:"rgba(0,0,0,0)",   // 枠の淡い塗りを透かす
    font:{color:"#e8eef7", size: MOBILE ? 11 : 12},
    margin: MOBILE ? {l:26, r:20, t:8, b:14} : {l:0, r:0, t:6, b:0},
    showlegend: false,
    scene:{// スマホは縦長の箱にして、勝率バーとの間の余白を使い切る
           aspectmode: MOBILE ? "manual" : "cube",
           aspectratio: MOBILE ? {x:1, y:1, z:1.25} : undefined,
           hovermode:"closest", camera: curCam,
      xaxis: axisCfg(LAB[fx]||fx, AXC.x),
      yaxis: axisCfg(LAB[fy]||fy, AXC.y),
      zaxis: axisCfg(LAB[fz]||fz, AXC.z, true)}
  }, {responsive:true, displaylogo:false, scrollZoom:"gl3d",
      displayModeBar: false});     // 右上のカメラ・虫眼鏡などのツールバーは出さない
}

// --- 3D 空間の外での回転・ズームを無効にする -----------------------------
// カラーバーや余白の上でホイールを回したときは、グラフを拡大せずページを
// スクロールさせる。ドラッグによる回転も立方体の領域内でのみ開始する。
// 回転・ズームが効く領域。勝率バーを含めたグラフ全体（＝枠で囲っている範囲）。
function sceneRect(){
  const r = g("plot").getBoundingClientRect();
  return {left:r.left, top:r.top, right:r.right, bottom:r.bottom};
}

// いまの仰角（描画中のカメラから直接読む）
function liveElev(){
  const gd = g("plot");
  let cam = null;
  try {
    const sc = gd._fullLayout && gd._fullLayout.scene && gd._fullLayout.scene._scene;
    if (sc && typeof sc.getCamera === "function") cam = sc.getCamera();
  } catch (e) {}
  if (!cam && gd._fullLayout && gd._fullLayout.scene) cam = gd._fullLayout.scene.camera;
  if (!cam || !cam.eye) return null;
  const c = cam.center || {x:0, y:0, z:0};
  const dx = cam.eye.x-c.x, dy = cam.eye.y-c.y, dz = cam.eye.z-c.z;
  const r = Math.sqrt(dx*dx + dy*dy + dz*dz);
  return r > 0 ? Math.asin(Math.max(-1, Math.min(1, dz/r))) : null;
}

let guardsInstalled = false;
function installGuards(){
  if (guardsInstalled) return;
  guardsInstalled = true;
  const plot = g("plot");
  const inScene = ev => {
    const r = sceneRect();
    if (!r) return true;
    const x = ev.clientX ?? (ev.touches && ev.touches[0] && ev.touches[0].clientX);
    const y = ev.clientY ?? (ev.touches && ev.touches[0] && ev.touches[0].clientY);
    if (x == null || y == null) return true;
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  };
  // 上限・下限に達したら、それ以上めくる向きの指の動きを plotly に渡さない。
  // （離したあとの補正だけでは、ドラッグ中に一瞬裏返って見えてしまうため）
  let lx = null, ly = null;
  const pos = ev => {
    const t = ev.touches && ev.touches[0];
    return {x: t ? t.clientX : ev.clientX, y: t ? t.clientY : ev.clientY};
  };
  ["mousedown", "touchstart"].forEach(t =>
    plot.addEventListener(t, ev => { const p = pos(ev); lx = p.x; ly = p.y; },
                          {capture:true, passive:true}));
  ["mousemove", "touchmove"].forEach(type => {
    plot.addEventListener(type, ev => {
      const p = pos(ev);
      if (p.x == null || p.y == null) return;
      if (lx != null){
        const dy = p.y - ly;
        const e = liveElev();
        if (e != null && dy !== 0){
          // この移動で仰角がどこまで動くかを見積もり、範囲を越えるなら渡さない。
          // 速くスワイプされても一瞬裏返らないよう、事前に止めるのが要点。
          // （横の動きが主なら dy が小さく見積もりも範囲内に収まるので、
          //   境界に貼り付いたままでも左右の回転は続けられる）
          const h = plot.getBoundingClientRect().height || 1;
          const next = e + dy * (170 * RAD / h);
          if (next < ELEV_MIN || next > ELEV_MAX){
            ev.stopPropagation();
            if (ev.cancelable) ev.preventDefault();
            return;                           // lx/ly は更新せず、境界に貼り付ける
          }
        }
      }
      lx = p.x; ly = p.y;
    }, {capture:true, passive:false});
  });

  ["wheel", "mousedown", "touchstart"].forEach(type => {
    plot.addEventListener(type, ev => {
      // 右上のツールバーは 3D 空間の外にあっても操作できるようにする
      if (ev.target && ev.target.closest && ev.target.closest(".modebar")) return;
      // 捕捉フェーズで止めると plotly のハンドラまで届かず、ページ側が処理する
      if (!inScene(ev)) ev.stopPropagation();
    }, {capture:true, passive:true});
  });
}

[sx,sy,sz,sf,sg].forEach(s => s.onchange = render);
q.oninput = render;
g("reset").onclick = () => {
  curCam = CAM;
  Plotly.relayout("plot", {"scene.camera": CAM});
  showInfo(null);
};
g("zin").onclick  = () => zoom(0.80);   // 寄る
g("zout").onclick = () => zoom(1.25);   // 引く
render();
showInfo(null);
installGuards();   // 判定はイベント発生時に行うので、描画完了を待つ必要はない

// ドラッグやズームの結果を覚えておき、軸を切り替えても視点を引き継ぐ。
// あわせて、仰角が上限を超えていたら境界まで戻す。
let fixing = false;
function onCamera(ev){
  const c = ev && (ev["scene.camera"] || (ev.scene && ev.scene.camera));
  if (!c || !c.eye || fixing) return;
  const fixed = clampCam(c);
  if (!fixed){ curCam = c; return; }
  curCam = fixed;
  fixing = true;
  const done = () => { fixing = false; };
  const p = Plotly.relayout("plot", {"scene.camera": fixed});
  if (p && p.then) p.then(done, done); else done();
}
if (g("plot").on){
  // 点をタップ／ホバーしたら、スマホでは下の欄に詳細を出す
  const pick = ev => { if (ev && ev.points && ev.points.length) showInfo(ev.points[0]); };
  g("plot").on("plotly_hover", pick);
  g("plot").on("plotly_click", pick);
  g("plot").on("plotly_relayout", onCamera);
  g("plot").on("plotly_relayouting", onCamera);   // ドラッグ中にも効かせる
}
</script></body></html>
